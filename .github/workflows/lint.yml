name: Lint & Type Check

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: '0.13.9'
          checksum: a7fbaff2b9a271d85c1bdb540941090fd1ce011797b4abeb48e4dcd39c2471d5

      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: uv sync

      - name: Ruff check
        run: uv run ruff check agent/ tests/

      - name: Ruff format
        run: uv run ruff format --check agent/ tests/

      - name: Run tests
        run: uv run pytest tests/ -v

      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '26'

      - name: Suggestion form tests
        run: node tests/test_suggestion_form.cjs
