name: Autonomous Writer

on:
  schedule:
    - cron: '0 8 * * *'   # 08:00 UTC daily
  workflow_dispatch:
    inputs:
      force:
        description: 'Skip schedule check and write immediately'
        type: boolean
        default: true

concurrency:
  group: autonomous-writer
  cancel-in-progress: false  # Queue, never discard a completed post

jobs:
  write:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          submodules: true

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: '0.13.9'
          checksum: a7fbaff2b9a271d85c1bdb540941090fd1ce011797b4abeb48e4dcd39c2471d5

      - name: Set up Python
        uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.11'

      - name: Install Hugo
        # Verify a fixed upstream archive without adding a third-party installer action.
        run: |
          curl --fail --location --retry 3 --output "$RUNNER_TEMP/hugo.tar.gz" \
            https://github.com/gohugoio/hugo/releases/download/v0.170.1/hugo_0.170.1_linux-amd64.tar.gz
          echo "841a5462853aefc9942e4de1e8a5d75584b6a5181941e6ad3f1d745190e03cd8  $RUNNER_TEMP/hugo.tar.gz" | sha256sum --check
          mkdir -p "$RUNNER_TEMP/hugo-bin"
          tar -xzf "$RUNNER_TEMP/hugo.tar.gz" -C "$RUNNER_TEMP/hugo-bin" hugo
          echo "$RUNNER_TEMP/hugo-bin" >> "$GITHUB_PATH"

      - name: Install dependencies
        run: uv sync

      - name: Run agent
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENROUTER_MODEL: ${{ secrets.OPENROUTER_MODEL }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
          ENABLE_RESEARCH: 'true'
          ENABLE_IMAGES: 'true'
          ENABLE_BLUESKY: 'true'
          BLUESKY_HANDLE: 'autonomouswriter.bsky.social'
          BLUESKY_APP_PASSWORD: ${{ secrets.BLUESKY_APP_PASSWORD }}
          ENABLE_BLUESKY_REPLIES: 'true'
          ENABLE_NEWSLETTER: 'true'
          BUTTONDOWN_API_KEY: ${{ secrets.BUTTONDOWN_API_KEY }}
          BUTTONDOWN_USERNAME: 'autonomouswriter'
          ENABLE_NEWSLETTER_REPLIES: 'true'
          ENABLE_SUGGESTIONS: 'true'
          SUGGESTION_ENCRYPTION_KEY: ${{ secrets.SUGGESTION_ENCRYPTION_KEY }}
          FORCE_POST: ${{ inputs.force }}
        run: uv run python -m agent.main

      - name: Commit new content
        id: commit
        run: |
          git config user.name "autonomous-writer[bot]"
          git config user.email "autonomous-writer[bot]@users.noreply.github.com"
          if [ -n "$(git status --porcelain)" ]; then
            git add site/content/posts/ system/memory.json system/prompts/ system/bluesky_state.json system/suggestions.json system/newsletter_reply_state.json
            git commit -m "post: $(date -u +%Y-%m-%d) [autonomous]"
            git push
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
          else
            echo "No new content. Scheduled post pending."
          fi

      - name: Deploy to Azure Static Web Apps
        if: steps.commit.outputs.has_changes == 'true'
        uses: Azure/static-web-apps-deploy@1a947af9992250f3bc2e68ad0754c0b0c11566c9 # v1
        env:
          HUGO_VERSION: 0.170.1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_ZEALOUS_WATER_001FE8510 }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: "upload"
          app_location: "/site"
          api_location: "/api"
          output_location: "public"
          skip_app_build: false
