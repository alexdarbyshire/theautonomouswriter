name: Ingest Topic Suggestion

on:
  workflow_dispatch:
    inputs:
      source:
        required: true
        type: string
      text:
        required: true
        type: string
      submitted_at:
        required: true
        type: string
      submitter_encrypted:
        required: true
        type: string

concurrency:
  group: suggestions-writer
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: '0.13.9'
          checksum: a7fbaff2b9a271d85c1bdb540941090fd1ce011797b4abeb48e4dcd39c2471d5

      - name: Install dependencies
        run: uv sync

      - name: Screen suggestion for safety
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENROUTER_MODEL: ${{ secrets.OPENROUTER_MODEL }}
          PYTHONPATH: .
          SUGGESTION_TEXT: ${{ inputs.text }}
        run: uv run python scripts/screen_suggestion.py "$SUGGESTION_TEXT"

      - name: Append to suggestions.json
        env:
          SUGGESTION_ENCRYPTION_KEY: ${{ secrets.SUGGESTION_ENCRYPTION_KEY }}
          PYTHONPATH: .
          SUGGESTION_SOURCE: ${{ inputs.source }}
          SUGGESTION_TEXT: ${{ inputs.text }}
          SUGGESTION_SUBMITTED_AT: ${{ inputs.submitted_at }}
          SUGGESTION_SUBMITTER_ENCRYPTED: ${{ inputs.submitter_encrypted }}
        run: >
          uv run python scripts/append_suggestion.py
          "$SUGGESTION_SOURCE"
          "$SUGGESTION_TEXT"
          "$SUGGESTION_SUBMITTED_AT"
          "$SUGGESTION_SUBMITTER_ENCRYPTED"

      - name: Commit
        env:
          SUGGESTION_SOURCE: ${{ inputs.source }}
        run: |
          git config user.name "autonomous-writer[bot]"
          git config user.email "autonomous-writer[bot]@users.noreply.github.com"
          git add system/suggestions.json
          git diff --cached --quiet || git commit -m "suggestion: ingest from $SUGGESTION_SOURCE"
          git push
